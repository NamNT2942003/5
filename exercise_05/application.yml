server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: http://quickbite-user:8081
          predicates:
            - Path=/api/v1/users/**

        - id: restaurant-service-route
          uri: http://quickbite-restaurant:8082
          predicates:
            - Path=/api/v1/restaurants/**

        - id: order-service-route
          uri: http://quickbite-order:8083
          predicates:
            - Path=/api/v1/orders/**

        - id: notification-service-route
          uri: http://quickbite-notification:8084
          predicates:
            - Path=/api/v1/notifications/**
